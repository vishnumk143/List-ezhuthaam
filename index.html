<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIST EZHUTHAAM - Fabrication Material & Estimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen font-sans antialiased transition-colors duration-200">

    <div id="app" class="max-w-md mx-auto bg-white dark:bg-slate-800 min-h-screen shadow-2xl flex flex-col relative overflow-hidden">
        
        <!-- Header -->
        <header class="bg-brand-600 text-white px-4 py-3 flex items-center justify-between shadow-md z-10">
            <div class="flex items-center space-x-3">
                <button id="back-btn" class="hidden text-white hover:text-indigo-200 text-lg p-1" onclick="goBack()">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <div class="flex items-center space-x-2">
                    <div class="bg-white text-brand-600 p-1.5 rounded-lg font-bold text-sm">
                        <i class="fa-solid fa-toolbox"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-base leading-tight">LIST EZHUTHAAM</h1>
                        <p class="text-xs text-indigo-200">Fabrication Material & Estimate</p>
                    </div>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button id="theme-toggle" class="p-2 rounded-full hover:bg-brand-700 text-indigo-100 transition" onclick="toggleTheme()">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="flex-1 overflow-y-auto pb-24">
            <!-- Dynamic Content -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="absolute bottom-0 left-0 right-0 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 px-6 py-2 flex justify-around items-center z-20 shadow-lg">
            <button onclick="router('home')" id="nav-home" class="flex flex-col items-center text-brand-600 dark:text-indigo-400">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">Home</span>
            </button>
            <button onclick="router('documents')" id="nav-docs" class="flex flex-col items-center text-slate-400 dark:text-slate-500 hover:text-brand-600">
                <i class="fa-solid fa-folder-open text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">Documents</span>
            </button>
            <button onclick="router('settings')" id="nav-settings" class="flex flex-col items-center text-slate-400 dark:text-slate-500 hover:text-brand-600">
                <i class="fa-solid fa-gear text-lg"></i>
                <span class="text-[10px] mt-1 font-medium">Settings</span>
            </button>
        </nav>

        <!-- Modal Container -->
        <div id="modal-container" class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
            <div id="modal-content" class="bg-white dark:bg-slate-800 rounded-2xl p-5 max-w-sm w-full shadow-2xl relative max-h-[90vh] overflow-y-auto">
                <!-- Modal Body -->
            </div>
        </div>

    </div>

    <!-- Application Script -->
    <script>
        const MATERIALS = [
            "MS Square Tube", "MS Rectangular Tube", "MS Round Pipe", "MS Angle", 
            "MS Flat Iron", "MS Channel", "MS Sheet", "MS Plate", "Chequered Plate",
            "GI Square Tube", "GI Round Pipe", "GI Sheet", "SS Sheet", "SS Pipe", 
            "SS Square Tube", "SS Flat", "Welding Rod", "Cutting Disc", "Grinding Disc",
            "Nuts & Bolts", "Washers", "Screws", "Hinges", "Locks", "Handles", "Tower Bolt",
            "Primer", "Enamel Paint", "Thinner"
        ];

        const SIZES_MAP = {
            "MS Square Tube": ["Custom Size", "1x1 inch", "1.5x1.5 inch", "2x2 inch", "3x3 inch"],
            "MS Rectangular Tube": ["Custom Size", "2x1 inch", "3x1.5 inch", "4x2 inch"],
            "MS Round Pipe": ["Custom Size", "1 inch", "1.5 inch", "2 inch", "3 inch"],
            "MS Angle": ["Custom Size", "25x25 mm", "40x40 mm", "50x50 mm"],
            "MS Flat Iron": ["Custom Size", "25x3 mm", "40x5 mm", "50x6 mm"]
        };

        const UNITS = ["Nos", "Piece", "Length", "Kg", "Gram", "Ton", "Feet", "Meter", "Sq.ft", "Sq.m", "Sheet", "Box", "Packet", "Set", "Litre", "Pair"];

        let state = {
            currentView: 'home',
            viewHistory: ['home'],
            darkMode: false,
            lastBackPress: 0,
            userProfile: JSON.parse(localStorage.getItem('list_ezhuthaam_profile')) || {
                companyName: 'My Fabrication Workshop',
                ownerName: 'Workshop Owner',
                phone: '9876543210',
                address: 'Main Road, Kerala'
            },
            documents: JSON.parse(localStorage.getItem('list_ezhuthaam_docs')) || [],
            currentDraft: {
                id: null,
                docNo: '',
                title: '',
                clientName: '',
                address: '',
                phone: '',
                date: '',
                type: 'requirement',
                items: [],
                photos: [],
                charges: { labour: 0, transportation: 0, other: 0, gstPercent: 18 },
                createdAt: null
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('list_ezhuthaam_theme');
            if (savedTheme === 'dark') {
                state.darkMode = true;
                document.documentElement.classList.add('dark');
                document.getElementById('theme-toggle').innerHTML = '<i class="fa-solid fa-sun text-yellow-400"></i>';
            }
            router('home', false);
            initSwipeNavigation();
        });

        // Touch Swipe Navigation (Swipe right to go back)
        function initSwipeNavigation() {
            let touchStartX = 0;
            let touchEndX = 0;
            const appContainer = document.getElementById('app');

            appContainer.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            }, false);

            appContainer.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipeGesture();
            }, false);

            function handleSwipeGesture() {
                // Swipe right distance > 80px and started near left edge or general right swipe
                if (touchEndX - touchStartX > 80 && state.viewHistory.length > 1) {
                    goBack();
                }
            }
        }

        function toggleTheme() {
            state.darkMode = !state.darkMode;
            if (state.darkMode) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('list_ezhuthaam_theme', 'dark');
                document.getElementById('theme-toggle').innerHTML = '<i class="fa-solid fa-sun text-yellow-400"></i>';
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('list_ezhuthaam_theme', 'light');
                document.getElementById('theme-toggle').innerHTML = '<i class="fa-solid fa-moon"></i>';
            }
        }

        function router(view, addToHistory = true, param = null) {
            if (addToHistory && state.viewHistory[state.viewHistory.length - 1] !== view) {
                state.viewHistory.push(view);
            }
            state.currentView = view;
            const main = document.getElementById('main-content');
            const backBtn = document.getElementById('back-btn');
            
            ['home', 'documents', 'settings'].forEach(nav => {
                const el = document.getElementById(`nav-${nav}`);
                if (el) el.className = "flex flex-col items-center text-slate-400 dark:text-slate-500 hover:text-brand-600";
            });

            if (['home', 'documents', 'settings'].includes(view)) {
                backBtn.classList.add('hidden');
                state.viewHistory = [view];
                if(view === 'home') document.getElementById('nav-home').className = "flex flex-col items-center text-brand-600 dark:text-indigo-400";
                if(view === 'documents') document.getElementById('nav-docs').className = "flex flex-col items-center text-brand-600 dark:text-indigo-400";
                if(view === 'settings') document.getElementById('nav-settings').className = "flex flex-col items-center text-brand-600 dark:text-indigo-400";
            } else {
                backBtn.classList.remove('hidden');
            }

            main.scrollTop = 0;
            main.innerHTML = '';

            switch(view) {
                case 'home': renderHome(main); break;
                case 'new-requirement': renderRequirementEditor(main); break;
                case 'new-estimate': renderEstimateEditor(main); break;
                case 'documents': renderDocuments(main); break;
                case 'settings': renderSettings(main); break;
                case 'preview-doc': renderDocPreview(main, param); break;
                case 'estimate-charges': renderEstimateCharges(main); break;
                default: renderHome(main);
            }
        }

        function goBack() {
            if (state.viewHistory.length > 1) {
                state.viewHistory.pop();
                const prevView = state.viewHistory[state.viewHistory.length - 1];
                router(prevView, false);
            } else {
                // Double back to exit app logic on Home screen
                const now = Date.now();
                if (now - state.lastBackPress < 2000) {
                    window.close();
                } else {
                    state.lastBackPress = now;
                    showNotification("Press back again to exit app", "info");
                }
            }
        }

        function renderHome(container) {
            container.innerHTML = `
                <div class="p-5 space-y-6">
                    <div class="bg-gradient-to-r from-brand-600 to-indigo-700 rounded-2xl p-5 text-white shadow-lg">
                        <div class="flex items-center space-x-3 mb-3">
                            <div class="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center text-2xl">
                                <i class="fa-solid fa-hammer"></i>
                            </div>
                            <div>
                                <h2 class="text-xl font-bold tracking-wide">LIST EZHUTHAAM</h2>
                                <p class="text-xs text-indigo-100">${state.userProfile.companyName}</p>
                            </div>
                        </div>
                        <p class="text-xs text-indigo-100 italic bg-black/10 p-2 rounded-lg">"Plan better. Build better. Material lists & estimates at your fingertips."</p>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="initNewDraft('requirement'); router('new-requirement')" class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition text-left flex flex-col justify-between group">
                            <div class="w-10 h-10 rounded-xl bg-indigo-50 dark:bg-indigo-900/40 text-brand-600 dark:text-indigo-400 flex items-center justify-center text-lg mb-3 group-hover:scale-110 transition">
                                <i class="fa-solid fa-list-check"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-sm text-slate-800 dark:text-slate-100">New Requirement</h3>
                                <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1">Create requirement with custom size & camera photo.</p>
                            </div>
                        </button>

                        <button onclick="initNewDraft('estimate'); router('new-estimate')" class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition text-left flex flex-col justify-between group">
                            <div class="w-10 h-10 rounded-xl bg-emerald-50 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-lg mb-3 group-hover:scale-110 transition">
                                <i class="fa-solid fa-file-invoice-dollar"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-sm text-slate-800 dark:text-slate-100">New Estimate</h3>
                                <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1">Prepare estimate with prices & automatic calculations.</p>
                            </div>
                        </button>

                        <button onclick="router('documents')" class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition text-left flex flex-col justify-between group">
                            <div class="w-10 h-10 rounded-xl bg-blue-50 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 flex items-center justify-center text-lg mb-3 group-hover:scale-110 transition">
                                <i class="fa-solid fa-folder-tree"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-sm text-slate-800 dark:text-slate-100">Documents</h3>
                                <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1">View saved requirements & estimates.</p>
                            </div>
                        </button>

                        <button onclick="router('settings')" class="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm hover:shadow-md transition text-left flex flex-col justify-between group">
                            <div class="w-10 h-10 rounded-xl bg-amber-50 dark:bg-amber-900/40 text-amber-600 dark:text-amber-400 flex items-center justify-center text-lg mb-3 group-hover:scale-110 transition">
                                <i class="fa-solid fa-sliders"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-sm text-slate-800 dark:text-slate-100">Settings</h3>
                                <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1">My Profile & Theme settings.</p>
                            </div>
                        </button>
                    </div>
                </div>
            `;
        }

        function initNewDraft(type) {
            const prefix = type === 'requirement' ? 'REQ' : 'EST';
            const num = Math.floor(1000 + Math.random() * 9000);
            state.currentDraft = {
                id: 'doc_' + Date.now(),
                docNo: `${prefix}-${num}`,
                title: type === 'requirement' ? 'Requirement List ' + num : 'Estimate ' + num,
                clientName: '',
                address: '',
                phone: '',
                date: new Date().toISOString().split('T')[0],
                type: type,
                items: [],
                photos: [],
                charges: { labour: 0, transportation: 0, other: 0, gstPercent: 18 },
                createdAt: new Date().toISOString()
            };
            addItemToDraft(false);
        }

        function addItemToDraft(reRender = true) {
            state.currentDraft.items.push({
                material: MATERIALS[0],
                size: 'Custom Size',
                customSizeInput: '',
                qty: 1,
                unit: 'Nos',
                price: 0
            });
            if (reRender) {
                if (state.currentDraft.type === 'requirement') renderRequirementEditor(document.getElementById('main-content'));
                else renderEstimateEditor(document.getElementById('main-content'));
            }
        }

        function removeItemFromDraft(index) {
            state.currentDraft.items.splice(index, 1);
            if(state.currentDraft.items.length === 0) addItemToDraft(false);
            if (state.currentDraft.type === 'requirement') renderRequirementEditor(document.getElementById('main-content'));
            else renderEstimateEditor(document.getElementById('main-content'));
        }

        function renderRequirementEditor(container) {
            const draft = state.currentDraft;
            container.innerHTML = `
                <div class="p-4 space-y-4 pb-24">
                    <div class="flex items-center justify-between">
                        <h2 class="font-bold text-lg text-slate-800 dark:text-slate-100">
                            <i class="fa-solid fa-list-check text-brand-600 mr-2"></i>New Requirement
                        </h2>
                        <span class="text-xs bg-indigo-100 dark:bg-indigo-900/40 text-brand-600 dark:text-indigo-300 px-2.5 py-1 rounded-full font-bold">${draft.docNo}</span>
                    </div>

                    <div class="bg-slate-50 dark:bg-slate-700/50 p-3 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-2">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[10px] text-slate-400 font-semibold">Client Name</label>
                                <input type="text" id="inp-client" value="${draft.clientName}" oninput="state.currentDraft.clientName = this.value" placeholder="Enter name" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg p-1.5 text-xs">
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-400 font-semibold">Phone Number</label>
                                <input type="tel" id="inp-phone" value="${draft.phone}" oninput="state.currentDraft.phone = this.value" placeholder="Phone number" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg p-1.5 text-xs">
                            </div>
                        </div>
                        <div>
                            <label class="text-[10px] text-slate-400 font-semibold">Address / Location</label>
                            <input type="text" id="inp-addr" value="${draft.address}" oninput="state.currentDraft.address = this.value" placeholder="Workshop / Site address" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg p-1.5 text-xs">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[10px] text-slate-400 font-semibold">List Title</label>
                                <input type="text" id="inp-title" value="${draft.title}" oninput="state.currentDraft.title = this.value" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg p-1.5 text-xs">
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-400 font-semibold">Date</label>
                                <input type="date" value="${draft.date}" oninput="state.currentDraft.date = this.value" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg p-1.5 text-xs">
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center justify-between bg-indigo-50 dark:bg-slate-700/60 p-3 rounded-2xl border border-indigo-100 dark:border-slate-600">
                        <div class="flex items-center space-x-2">
                            <i class="fa-solid fa-camera text-brand-600 text-lg"></i>
                            <div>
                                <h4 class="text-xs font-bold text-slate-800 dark:text-slate-100">Project Photos</h4>
                                <p class="text-[10px] text-slate-400">${draft.photos.length} photo(s) attached</p>
                            </div>
                        </div>
                        <div class="flex space-x-2">
                            <button onclick="document.getElementById('camera-input').click()" class="bg-brand-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow hover:bg-brand-700 transition flex items-center space-x-1">
                                <i class="fa-solid fa-camera"></i>
                                <span>Camera</span>
                            </button>
                            <button onclick="document.getElementById('gallery-input').click()" class="bg-indigo-100 dark:bg-slate-600 text-brand-600 dark:text-indigo-200 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-indigo-200 transition">
                                <i class="fa-solid fa-image"></i>
                            </button>
                            <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden" onchange="handlePhotoFiles(event)">
                            <input type="file" id="gallery-input" accept="image/*" multiple class="hidden" onchange="handlePhotoFiles(event)">
                        </div>
                    </div>

                    ${draft.photos.length > 0 ? `
                        <div class="flex space-x-2 overflow-x-auto py-1">
                            ${draft.photos.map((p, idx) => `
                                <div class="relative w-16 h-16 rounded-xl overflow-hidden border border-slate-200 flex-shrink-0 group cursor-pointer" onclick="openPhotoPreview('${p}')">
                                    <img src="${p}" class="w-full h-full object-cover">
                                    <button onclick="event.stopPropagation(); removePhoto(${idx})" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-[10px] shadow">
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}

                    <div class="space-y-3">
                        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400">Welding & Fabrication Materials</label>
                        ${draft.items.map((item, idx) => `
                            <div class="bg-slate-50 dark:bg-slate-700/50 p-3 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-2">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs font-bold text-brand-600 dark:text-indigo-400">Item #${idx + 1}</span>
                                    <button onclick="removeItemFromDraft(${idx})" class="text-red-500 hover:text-red-700 text-xs p-1">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="text-[10px] text-slate-400 font-semibold">Material</label>
                                        <select onchange="updateItemMaterial(${idx}, this.value)" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg p-1.5 text-xs">
                                            ${MATERIALS.map(mat => `<option value="${mat}" ${item.material === mat ? 'selected' : ''}>${mat}</option>`).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="text-[10px] text-slate-400 font-semibold">Size</label>
                                        <select onchange="updateItemSize(${idx}, this.value)" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg p-1.5 text-xs">
                                            <option value="Custom Size" ${item.size === 'Custom Size' ? 'selected' : ''}>Custom Size</option>
                                            ${(SIZES_MAP[item.material] || []).filter(s => s !== 'Custom Size').map(s => `<option value="${s}" ${item.size === s ? 'selected' : ''}>${s}</option>`).join('')}
                                        </select>
                                    </div>
                                </div>
                                ${item.size === 'Custom Size' ? `
                                    <div>
                                        <label class="text-[10px] text-brand-600 font-semibold">Custom Size Details</label>
                                        <input type="text" id="cust-size-${idx}" value="${item.customSizeInput || ''}" oninput="state.currentDraft.items[${idx}].customSizeInput = this.value" placeholder="Type custom size (e.g. 2.5 x 1.2 inch)" class="w-full bg-white dark:bg-slate-800 border border-brand-300 dark:border-indigo-600 rounded-lg p-1.5 text-xs">
                                    </div>
                                ` : ''}
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="text-[10px] text-slate-400">Quantity</label>
                                        <input type="number" min="1" value="${item.qty}" oninput="state.currentDraft.items[${idx}].qty = parseFloat(this.value) || 0" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg p-1.5 text-xs">
                                    </div>
                                    <div>
                                        <label class="text-[10px] text-slate-400">Unit</label>
                                        <select onchange="state.currentDraft.items[${idx}].unit = this.value" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg p-1.5 text-xs">
                                            ${UNITS.map(u => `<option value="${u}" ${item.unit === u ? 'selected' : ''}>${u}</option>`).join('')}
                                        </select>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <button onclick="addItemToDraft(true)" class="w-full py-2.5 border-2 border-dashed border-indigo-300 dark:border-slate-600 text-brand-600 dark:text-indigo-400 rounded-xl text-xs font-bold hover:bg-indigo-50/50 transition flex items-center justify-center space-x-1">
                        <i class="fa-solid fa-plus"></i>
                        <span>Add Material</span>
                    </button>

        function updateEstimateLiveTotals() {

            const other = draft.charges?.other || 0;
            const subTotal = materialTotal + labour + transport + other;
            const gstPercent = draft.charges?.gstPercent !== undefined ? draft.charges.gstPercent : 18;
            const gstAmount = (subTotal * gstPercent) / 100;
            const grandTotal = subTotal + gstAmount;

            const st = document.getElementById('txt-subtotal');
            const gt = document.getElementById('txt-gst');
            const gtot = document.getElementById('txt-grand');
            if(st) st.innerText = `₹${subTotal.toFixed(2)}`;
            if(gt) gt.innerText = `₹${gstAmount.toFixed(2)}`;
            if(gtot) gtot.innerText = `₹${grandTotal.toFixed(2)}`;

            if(idx >= 0) {
                state.documents[idx] = state.currentDraft;

            showNotification("Document saved successfully!", "success");
            router('documents', true);

                                <thead class="bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
                                    <tr>
                                        <th class="p-2.5 border-b border-slate-200 dark:border-slate-600">Material & Size</th>
                                        <th class="p-2.5 border-b border-slate-200 dark:border-slate-600">Qty</th>
                                        ${doc.type === 'estimate' ? '<th class="p-2.5 border-b border-slate-200 dark:border-slate-600">Price</th><th class="p-2.5 border-b border-slate-200 dark:border-slate-600 text-right">Total</th>' : ''}
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
                                    ${doc.items.map(item => `
                                        <tr>
                                            <td class="p-2.5 font-medium">${item.material} <br><span class="text-[10px] text-slate-400">Size: ${item.size === 'Custom Size' && item.customSizeInput ? item.customSizeInput : item.size}</span></td>
                                            <td class="p-2.5">${item.qty} ${item.unit}</td>
                                            ${doc.type === 'estimate' ? `
                                                <td class="p-2.5">₹${item.price}</td>
                                                <td class="p-2.5 text-right font-bold">₹${(item.qty * item.price).toFixed(2)}</td>
                                            ` : ''}
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    ${doc.type === 'estimate' ? `
                        <div class="bg-slate-50 dark:bg-slate-700/50 p-3 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-1.5 text-xs">
                            <div class="flex justify-between text-slate-500"><span>Material Total</span><span>₹${materialTotal.toFixed(2)}</span></div>
                            ${labour > 0 ? '<div class="flex justify-between text-slate-500"><span>Labour</span><span>₹' + labour + '</span></div>' : ''}
                            ${transport > 0 ? '<div class="flex justify-between text-slate-500"><span>Transportation</span><span>₹' + transport + '</span></div>' : ''}
                            ${other > 0 ? '<div class="flex justify-between text-slate-500"><span>Other</span><span>₹' + other + '</span></div>' : ''}
                            <div class="flex justify-between text-slate-500"><span>GST (${gstPercent}%)</span><span>₹${gstAmount.toFixed(2)}</span></div>
                            <div class="flex justify-between text-sm font-bold text-emerald-600 pt-2 border-t border-slate-200 dark:border-slate-600"><span>Grand Total</span><span>₹${grandTotal.toFixed(2)}</span></div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function openShareModal(id) {
            showModal(`
                <div class="space-y-4 text-center">
                    <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">
                        <i class="fa-solid fa-share-nodes"></i>
                    </div>
                    <h3 class="font-bold text-base text-slate-800 dark:text-slate-100">Choose Professional Share Type</h3>
                    <p class="text-xs text-slate-400">Select format to export or share your document with company branding and client details.</p>
                    
                    <div class="grid grid-cols-3 gap-2 pt-2">
                        <button onclick="shareAsDocument('${id}')" class="bg-indigo-50 dark:bg-slate-700 hover:bg-indigo-100 p-3 rounded-xl flex flex-col items-center space-y-1 transition text-brand-600 dark:text-indigo-300">
                            <i class="fa-solid fa-file-lines text-lg"></i>
                            <span class="text-xs font-bold">Document</span>
                        </button>
                        <button onclick="shareAsPDF('${id}')" class="bg-red-50 dark:bg-slate-700 hover:bg-red-100 p-3 rounded-xl flex flex-col items-center space-y-1 transition text-red-600">
                            <i class="fa-solid fa-file-pdf text-lg"></i>
                            <span class="text-xs font-bold">PDF File</span>
                        </button>
                        <button onclick="shareAsImage('${id}')" class="bg-amber-50 dark:bg-slate-700 hover:bg-amber-100 p-3 rounded-xl flex flex-col items-center space-y-1 transition text-amber-600">
                            <i class="fa-solid fa-file-image text-lg"></i>
                            <span class="text-xs font-bold">Image</span>
                        </button>
                    </div>

                    <button onclick="closeModal()" class="w-full bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 py-2 rounded-xl text-xs font-bold mt-2">Cancel</button>
                </div>
            `);
        }

        async function shareAsDocument(id) {
            const doc = state.documents.find(d => d.id === id);
            if(!doc) return;

            let text = `================================\n`;
            text += `   ${state.userProfile.companyName.toUpperCase()}\n`;
            text += `   ${state.userProfile.address} | Ph: ${state.userProfile.phone}\n`;
            text += `================================\n\n`;
            text += `*${doc.type.toUpperCase()} - ${doc.docNo}*\n`;
            text += `Title: ${doc.title}\nDate: ${doc.date}\n`;
            if(doc.clientName) {
                text += `\n*Client Details:*\nName: ${doc.clientName}\nPhone: ${doc.phone}\nAddress: ${doc.address}\n`;
            }
            text += `\n*Materials List:*\n`;
            doc.items.forEach((it, i) => {
                const sText = it.size === 'Custom Size' && it.customSizeInput ? it.customSizeInput : it.size;
                text += `${i+1}. ${it.material} (${sText}) - ${it.qty} ${it.unit} ${doc.type === 'estimate' ? '@ ₹' + it.price + ' = ₹' + (it.qty*it.price) : ''}\n`;
            });

            if(doc.type === 'estimate') {
                const matTot = doc.items.reduce((s, it) => s + (it.qty * it.price), 0);
                const labour = doc.charges?.labour || 0;
                const transport = doc.charges?.transportation || 0;
                const other = doc.charges?.other || 0;
                const subT = matTot + labour + transport + other;
                const gstP = doc.charges?.gstPercent !== undefined ? doc.charges.gstPercent : 18;
                const gstA = (subT * gstP) / 100;
                
                text += `\nMaterial Total: ₹${matTot}\n`;
                if(labour > 0) text += `Labour: ₹${labour}\n`;
                if(transport > 0) text += `Transportation: ₹${transport}\n`;
                if(other > 0) text += `Other Charges: ₹${other}\n`;
                text += `Sub Total: ₹${subT}\n`;
                text += `GST (${gstP}%): ₹${gstA}\n`;
                text += `*Grand Total: ₹${subT + gstA}*\n`;
            }
            text += `\n--------------------------------\nGenerated via LIST EZHUTHAAM`;

            if (navigator.share) {
                try {
                    await navigator.share({ title: doc.title, text: text });
                    closeModal();
                    return;
                } catch (err) {}
            }

            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showNotification("Document copied to clipboard!", "success");
                closeModal();
            } catch (err) {
                showNotification("Sharing failed.", "error");
            }
            document.body.removeChild(ta);
        }

        function shareAsPDF(id) {
            router('preview-doc', true, id);
            closeModal();
            setTimeout(() => {
                const element = document.getElementById('printable-doc-area');
                if(!element) {
                    showNotification("PDF generation error.", "error");
                    return;
                }
                const opt = {
                    margin: 0.4,
                    filename: `ListEzhuthaam_${id}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
                };
                html2pdf().from(element).set(opt).save().then(() => {
                    showNotification("Professional PDF downloaded successfully!", "success");
                }).catch(() => {
                    showNotification("PDF generation failed.", "error");
                });
            }, 500);
        }

        function shareAsImage(id) {
            router('preview-doc', true, id);
            closeModal();
            setTimeout(() => {
                const element = document.getElementById('printable-doc-area');
                if(!element) {
                    showNotification("Image generation error.", "error");
                    return;
                }
                html2canvas(element, { scale: 2, useCORS: true }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `ListEzhuthaam_${id}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showNotification("Professional Image downloaded successfully!", "success");
                }).catch(() => {
                    showNotification("Image export failed.", "error");
                });
            }, 500);
        }

        function convertToEstimate(id) {
            const reqDoc = state.documents.find(d => d.id === id);
            if(!reqDoc) return;
            const num = Math.floor(1000 + Math.random() * 9000);
            state.currentDraft = {
                id: 'doc_' + Date.now(),
                docNo: `EST-${num}`,
                title: 'Estimate for ' + reqDoc.title,
                clientName: reqDoc.clientName || '',
                address: reqDoc.address || '',
                phone: reqDoc.phone || '',
                date: new Date().toISOString().split('T')[0],
                type: 'estimate',
                items: JSON.parse(JSON.stringify(reqDoc.items)).map(item => ({ ...item, price: 0 })),
                photos: [],
                charges: { labour: 0, transportation: 0, other: 0, gstPercent: 18 },
                createdAt: new Date().toISOString()
            };
            router('new-estimate', true);
            showNotification("Converted requirement to estimate!", "success");
        }

        function editDoc(id) {
            const doc = state.documents.find(d => d.id === id);
            if(!doc) return;
            state.currentDraft = JSON.parse(JSON.stringify(doc));
            if(doc.type === 'requirement') router('new-requirement', true);
            else router('new-estimate', true);
        }

        function renderSettings(container) {
            const p = state.userProfile;
            container.innerHTML = `
                <div class="p-4 space-y-4 pb-24">
                    <h2 class="font-bold text-lg text-slate-800 dark:text-slate-100"><i class="fa-solid fa-sliders text-brand-600 mr-2"></i>Settings & Profile</h2>

                    <div class="bg-slate-50 dark:bg-slate-700/50 p-4 rounded-2xl border border-slate-200 dark:border-slate-700 space-y-3">
                        <h3 class="font-bold text-xs uppercase tracking-wider text-brand-600 dark:text-indigo-400">My Company Profile (Header details for Share/PDF)</h3>
                        
                        <div class="space-y-2 text-xs">
                            <div>
                                <label class="text-[10px] text-slate-400 font-semibold">Company / Workshop Name</label>
                                <input type="text" id="prof-comp" value="${p.companyName}" oninput="updateProfileField('companyName', this.value)" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg p-2">
                            </div>
                            <div>
                                <label class="text-[10px] text-slate-400 font-semibold">Owner Name</label>
                                <input type="text" id="prof-owner" value="${p.ownerName}" oninput="updateProfileField('ownerName', this.value)" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg p-2">
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="text-[10px] text-slate-400 font-semibold">Phone Number</label>
                                    <input type="tel" id="prof-phone" value="${p.phone}" oninput="updateProfileField('phone', this.value)" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg p-2">
                                </div>
                                <div>
                                    <label class="text-[10px] text-slate-400 font-semibold">Address</label>
                                    <input type="text" id="prof-addr" value="${p.address}" oninput="updateProfileField('address', this.value)" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 rounded-lg p-2">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-slate-50 dark:bg-slate-700/50 rounded-2xl border border-slate-200 dark:border-slate-700 overflow-hidden divide-y divide-slate-200 dark:divide-slate-700">
                        <div class="p-4 flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <i class="fa-solid fa-circle-half-stroke text-brand-600"></i>
                                <div>
                                    <h4 class="text-sm font-bold text-slate-800 dark:text-slate-100">Dark Mode</h4>
                                    <p class="text-[11px] text-slate-400">Toggle light or dark theme</p>
                                </div>
                            </div>
                            <input type="checkbox" ${state.darkMode ? 'checked' : ''} onchange="toggleTheme()" class="w-5 h-5 accent-brand-600 cursor-pointer">
                        </div>

                        <div class="p-4 flex items-center justify-between cursor-pointer" onclick="showAboutModal()">
                            <div class="flex items-center space-x-3">
                                <i class="fa-solid fa-circle-info text-brand-600"></i>
                                <div>
                                    <h4 class="text-sm font-bold text-slate-800 dark:text-slate-100">About App</h4>
                                    <p class="text-[11px] text-slate-400">LIST EZHUTHAAM v1.0.5</p>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-right text-slate-400 text-xs"></i>
                        </div>
                    </div>
                </div>
            `;
        }

        function updateProfileField(field, val) {
            state.userProfile[field] = val;
            localStorage.setItem('list_ezhuthaam_profile', JSON.stringify(state.userProfile));
        }

        function showAboutModal() {
            showModal(`
                <div class="text-center space-y-3">
                    <div class="w-12 h-12 bg-indigo-100 text-brand-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">
                        <i class="fa-solid fa-toolbox"></i>
                    </div>
                    <h3 class="font-bold text-base text-slate-800 dark:text-slate-100">LIST EZHUTHAAM</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Welding & Fabrication Material & Estimate App designed for workers, contractors and small workshops.</p>
                    <button onclick="closeModal()" class="w-full bg-brand-600 text-white py-2 rounded-xl text-xs font-bold mt-2">Close</button>
                </div>
            `);
        }

        function showNotification(message, type = 'success') {
            const notif = document.createElement('div');
            notif.className = `fixed top-4 left-1/2 transform -translate-x-1/2 z-50 px-4 py-2 rounded-xl text-xs font-bold text-white shadow-lg transition-all ${type === 'success' ? 'bg-emerald-600' : 'bg-brand-600'}`;
            notif.innerText = message;
            document.body.appendChild(notif);
            setTimeout(() => {
                notif.style.opacity = '0';
                setTimeout(() => notif.remove(), 300);
            }, 2500);
        }

        function showModal(html) {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            content.innerHTML = html;
            container.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-container').classList.add('hidden');
        }
    </script>
</body>
</html>
